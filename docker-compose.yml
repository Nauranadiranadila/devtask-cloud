services:
  postgres:
    image: postgres:16
    container_name: devtask-cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devtask
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - devtask_postgres_data:/var/lib/postgresql/data

volumes:
  devtask_postgres_data:
