services:
  - type: web
    name: devtask-cloud-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: devtask-cloud-db
          property: connectionString
      - key: CORS_ORIGIN
        value: https://devtask-cloud.onrender.com

  - type: static
    name: devtask-cloud
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://devtask-cloud-api.onrender.com/api

databases:
  - name: devtask-cloud-db
    databaseName: devtask
    user: devtask_user
